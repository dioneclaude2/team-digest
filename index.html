<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Team digest</title>
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--text:#16191d;--muted:#5d6876;--faint:#8a94a1;--line:#e4e7eb;--soft:#f0f2f5;
  --green:#178a4c;--green-soft:#e3f4ea;--red:#c7362f;--red-soft:#fdeceb;--amber:#a86200;--amber-soft:#fdf2df;
  --blue:#2459c4;--blue-soft:#e6eefc;--violet:#6b46c1;--violet-soft:#efe9fb;--ink-on-accent:#fff;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1013;--card:#171a1f;--text:#e9ecef;--muted:#a2acb8;--faint:#77818d;--line:#2a2f36;--soft:#1f2329;
  --green:#3ccf7f;--green-soft:#173326;--red:#ff6d64;--red-soft:#3a1d1b;--amber:#f2b149;--amber-soft:#3a2c12;
  --blue:#7fa6ff;--blue-soft:#1b2640;--violet:#b39bff;--violet-soft:#2a2242;--ink-on-accent:#0b1a10;
  --shadow:none;}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 80px}
/* lock */
.lock{max-width:380px;margin:14vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}
.lock h1{font-size:20px;margin:0 0 4px}.lock p{color:var(--muted);margin:0 0 18px;font-size:14px}
.lock input[type=password]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--ink-on-accent)}
.lock .btn.primary{width:100%;justify-content:center;padding:12px;margin-top:12px;border-radius:10px;font-size:16px}
.rem{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;color:var(--muted)}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}
/* app */
#app{display:none}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;padding:12px 16px 0}
.row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:auto;display:flex;align-items:center;gap:8px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.pill.unread{background:var(--green-soft);color:var(--green)}.pill.read{background:var(--soft);color:var(--muted)}
.sub{color:var(--muted);font-size:13px;margin:4px 0 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);text-decoration:none}
.tab b{color:var(--text);margin-left:4px}
.search{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;margin:18px 0 6px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--text);box-shadow:var(--shadow)}
.stat .n{font-size:28px;font-weight:750;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted);margin-top:2px}
.stat .bar{height:6px;border-radius:9px;background:var(--soft);margin-top:10px;overflow:hidden}.stat .bar i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .3s}
.stat.t .n{color:var(--green)}.stat.w .n{color:var(--red)}.stat.m .n{color:var(--violet)}.stat.c .n{color:var(--blue)}.stat.a .n{color:var(--violet)}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
/* sections */
section{margin-top:28px}
.sh{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.sh h2{font-size:18px;margin:0}
.sh .count{font-size:12px;font-weight:700;color:var(--muted);background:var(--soft);padding:2px 8px;border-radius:999px}
.sh .tools{margin-left:auto;display:flex;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.list{list-style:none;margin:0;padding:0}
.list>li{padding:12px 16px;border-top:1px solid var(--line)}.list>li:first-child{border-top:0}
.list>li ul{margin:6px 0 0;padding-left:18px}
/* tasks */
.task{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.task input{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;margin-top:2px;border:2px solid var(--faint);border-radius:6px;display:grid;place-content:center;cursor:pointer;background:var(--card)}
.task input:checked{background:var(--green);border-color:var(--green)}
.task input:checked::after{content:"";width:10px;height:6px;border:solid var(--ink-on-accent);border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.task .tx{flex:1}
.task .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.chip.due{background:var(--amber-soft);color:var(--amber)}.chip.over{background:var(--red-soft);color:var(--red)}
.task.done .tx{color:var(--faint);text-decoration:line-through}
.task.done .chip{opacity:.6}
.hide-done .task.done{display:none}
.empty{padding:16px;color:var(--muted)}
/* mentions */
.mention{display:flex;gap:12px}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-content:center;font-weight:700;font-size:14px;color:#fff}
.mention .who{font-weight:650}.mention .when{color:var(--faint);font-size:12px;margin-left:6px}
.mention .msg{margin-top:2px}
details.replied{margin-top:10px}
details.replied summary{cursor:pointer;color:var(--muted);font-size:14px;font-weight:600;padding:6px 2px}
details.replied .list>li{opacity:.75}
/* waiting */
.wait>li{border-left:3px solid var(--red)}
/* campaigns */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.camp{padding:16px}
.camp h3{margin:0 0 8px;font-size:16px}
.camp .status{background:var(--soft);border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:14px}
.camp ul{list-style:none;margin:0;padding:0}
.camp li{padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.camp li:first-child{border-top:0}
.lbl{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:1px 7px;border-radius:6px;margin-right:6px;vertical-align:1px}
.lbl.decided{background:var(--green-soft);color:var(--green)}.lbl.changed{background:var(--amber-soft);color:var(--amber)}
.lbl.next{background:var(--blue-soft);color:var(--blue)}.lbl.other{background:var(--soft);color:var(--muted)}
.camp li.next{background:var(--blue-soft);border-radius:8px;padding:6px 8px;border-top:0;margin-top:4px}
.hl{background:var(--amber-soft);border-radius:3px}
/* ask the team */
.askc{padding:16px;margin-bottom:12px}
.askc h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.col{border-radius:10px;padding:10px 12px;font-size:14px}
.col h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.col ul{margin:0;padding-left:16px}.col li{margin:3px 0}
.col.fin{background:var(--green-soft)}.col.fin h4{color:var(--green)}
.col.not{background:var(--amber-soft)}.col.not h4{color:var(--amber)}
.col.wait{background:var(--blue-soft)}.col.wait h4{color:var(--blue)}
.col .none{color:var(--faint);font-style:italic;list-style:none;margin-left:-16px}
.qs{margin-top:12px;border:1px solid var(--line);border-radius:10px}
.qs .qh{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;color:var(--violet)}
.qs .qh .btn{margin-left:auto;padding:4px 10px;font-size:12px}
.q{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.q:first-of-type{border-top:0}
.q .tx{flex:1}.q .who{font-size:12px;font-weight:700;color:var(--violet);background:var(--violet-soft);padding:1px 7px;border-radius:999px;margin-right:6px}
.q input{appearance:none;-webkit-appearance:none;flex:none;width:18px;height:18px;margin-top:2px;border:2px solid var(--faint);border-radius:50%;cursor:pointer;display:grid;place-content:center}
.q input:checked{background:var(--violet);border-color:var(--violet)}
.q input:checked::after{content:"";width:8px;height:5px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
.q.asked .tx{color:var(--faint);text-decoration:line-through}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.foot{margin-top:40px;color:var(--faint);font-size:13px;text-align:center}
.gone{display:none!important}
</style></head><body>
<div class="wrap" id="lockwrap">
  <div class="lock">
    <h1>🔒 Team digest</h1>
    <p>Enter the password to open the digest.</p>
    <form id="f"><input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus>
    <label class="rem"><input type="checkbox" id="rem" checked> Keep me unlocked on this device (locks after 1 day of not opening it)</label>
    <button class="btn primary" type="submit">Unlock</button><div class="err" id="err"></div></form>
  </div>
</div>
<div id="app">
  <div class="top"><div class="in">
    <div class="row1">
      <div class="brand">📋 Team digest <span class="pill" id="state"></span></div>
      <a class="btn primary" id="readbtn" target="_blank" rel="noopener">✓ Mark as read</a>
      <button class="btn" id="lockbtn">Lock</button>
    </div>
    <div class="sub" id="sub"></div>
    <nav class="tabs" id="tabs"></nav>
  </div></div>
  <div class="wrap">
    <div class="stats" id="stats"></div>
    <input class="search" id="q" type="search" placeholder="Search tasks, campaigns, people…">
    <div id="sections"></div>
    <div class="foot">Decrypted in your browser. Ticks are saved on this device.</div>
  </div>
</div>

const store={get(k){try{return localStorage.getItem(k)}catch(_){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}},del(k){try{localStorage.removeItem(k)}catch(_){}}};
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const COLORS=["#e4572e","#2e86ab","#a23b72","#3b8b5a","#c17817","#5b5bd6","#0f8b8d","#b0413e"];
const colorFor=s=>COLORS[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
const KIND=t=>t.includes("Ask the team")?"ask":t.includes("My tasks")?"tasks":t.includes("mentioned")?"mentions":t.includes("Waiting on your reply")||t.includes("Needs you")?"waiting":t.includes("Campaign")?"campaigns":t.includes("decisions")?"decisions":t.includes("changes")?"changes":t.includes("Open")?"open":"other";

function build(P){
  const doc=new DOMParser().parseFromString("<div>"+P.html+"</div>","text/html").body.firstChild;
  // split into sections by h2
  const secs=[];let cur=null;
  [...doc.childNodes].forEach(n=>{if(n.nodeName==="H2"){cur={title:n.textContent.trim(),nodes:[]};secs.push(cur)}else if(cur)cur.nodes.push(n)});
  document.getElementById("state").textContent=P.state==="OPEN"?"Unread":"Read";
  document.getElementById("state").className="pill "+(P.state==="OPEN"?"unread":"read");
  document.getElementById("readbtn").href=P.url;
  if(P.state!=="OPEN")document.getElementById("readbtn").classList.add("gone");
  document.getElementById("sub").textContent=P.title.replace(/^📋\s*/,"");
  const root=document.getElementById("sections"),tabs=document.getElementById("tabs");
  const stats={};
  secs.forEach((s,idx)=>{
    const kind=KIND(s.title),id="s"+idx;
    const sec=el("section");sec.id=id;sec.dataset.kind=kind;
    const name=s.title.replace(/\s*\(.*?\)\s*$/,"");
    const sh=el("div","sh");sh.append(el("h2","",name));const cnt=el("span","count");sh.append(cnt);sec.append(sh);
    const holder=el("div");holder.append(...s.nodes.map(n=>n.cloneNode(true)));
    let count=0;
    if(kind==="tasks"){
      const ul=el("ul","list"),card=el("div","card");
      const today=new Date().toISOString().slice(0,10);
      holder.querySelectorAll("li").forEach(li=>{
        const m=li.textContent.match(/⟦(t\d+)⟧/);if(!m){const e=el("li","empty",li.innerHTML);ul.append(e);return}
        const tid=m[1];
        const em=li.querySelector("em");const metaTxt=em?em.textContent.replace(/^\(|\)$/g,""):"";if(em)em.remove();
        li.querySelectorAll("input").forEach(i=>i.remove());
        const text=li.innerHTML.replace(/⟦t\d+⟧/,"").trim();
        const row=el("li","task");const cb=el("input");cb.type="checkbox";
        const tx=el("div","tx");tx.append(el("div","",text));
        const meta=el("div","meta");
        metaTxt.split(" · ").forEach(p=>{p=p.trim();if(!p)return;
          if(p.startsWith("due ")){const d=p.slice(4);const c=d<today?"over":"due";meta.append(el("span","chip "+c,(d<today?"Overdue · ":d===today?"Today · ":"Due ")+d.slice(5)))}
          else meta.append(el("span","chip",p))});
        tx.append(meta);row.append(cb,tx);
        const key="task:"+tid;cb.checked=store.get(key)==="1";row.classList.toggle("done",cb.checked);
        const sync=()=>{row.classList.toggle("done",cb.checked);cb.checked?store.set(key,"1"):store.del(key);refreshTasks()};
        cb.addEventListener("change",sync);row.addEventListener("click",e=>{if(e.target!==cb){cb.checked=!cb.checked;sync()}});
        ul.append(row);
      });
      card.append(ul);
      const tools=el("div","tools");const hide=el("button","btn","Hide done");
      let hidden=store.get("hideDone")==="1";const applyHide=()=>{card.classList.toggle("hide-done",hidden);hide.textContent=hidden?"Show done":"Hide done"};applyHide();
      hide.onclick=()=>{hidden=!hidden;hidden?store.set("hideDone","1"):store.del("hideDone");applyHide()};
      tools.append(hide);sh.append(tools);sec.append(card);
      window.refreshTasks=()=>{const all=ul.querySelectorAll(".task").length,done=ul.querySelectorAll(".task.done").length;
        cnt.textContent=done+" / "+all+" done";const st=document.querySelector(".stat.t");
        if(st){st.querySelector(".n").textContent=all-done;st.querySelector(".bar i").style.width=(all?done/all*100:0)+"%"}
        // undone first
        [...ul.querySelectorAll(".task.done")].forEach(r=>ul.append(r))};
      count=ul.querySelectorAll(".task").length;stats.tasks={n:count,id};
    }else if(kind==="mentions"){
      const mk=ul0=>{const ul=el("ul","list");ul0.querySelectorAll(":scope > li").forEach(li=>{
        const st=li.querySelector("strong");if(!st){ul.append(el("li","empty",li.innerHTML));return}
        const [when,chat,who]=st.textContent.replace(/:$/,"").split(" · ");st.remove();
        const r=el("li","mention");const av=el("div","av",(who||"?").trim()[0].toUpperCase());av.style.background=colorFor(who||"");
        const b=el("div");b.append(el("div","",`<span class="who">${who||""}</span><span class="when">${when||""}</span>`));
        const meta=el("div","meta");meta.style.margin="2px 0";meta.append(el("span","chip",chat||""));b.append(meta);
        b.append(el("div","msg",li.innerHTML.trim()));r.append(av,b);ul.append(r)});return ul};
      const firstUl=holder.querySelector(":scope > ul");const card=el("div","card");if(firstUl){card.append(mk(firstUl))}sec.append(card);
      count=card.querySelectorAll(".mention").length;
      const det=holder.querySelector("details");
      if(det){const d=el("details","replied");d.append(el("summary","",det.querySelector("summary").textContent));
        const c2=el("div","card");const inner=det.querySelector("ul");if(inner)c2.append(mk(inner));d.append(c2);sec.append(d)}
      stats.mentions={n:count,id};
    }else if(kind==="ask"){
      let card=null,cols=null,qbox=null,qcount=0;const hash=t=>[...t].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,0).toString(36);
      const newCard=title=>{card=el("div","card askc");card.append(el("h3","",title));
        cols={fin:el("div","col fin","<h4>✅ Finalised</h4><ul></ul>"),not:el("div","col not","<h4>🟡 Not finalised</h4><ul></ul>"),wait:el("div","col wait","<h4>⏳ Still awaiting</h4><ul></ul>")};
        const g=el("div","cols");g.append(cols.fin,cols.not,cols.wait);card.append(g);
        qbox=el("div","qs");const qh=el("div","qh","❓ Ask the team");const cp=el("button","btn","Copy questions");qh.append(cp);qbox.append(qh);
        const cardTitle=title;cp.onclick=()=>{const qs=[...qbox.querySelectorAll(".q:not(.asked) .tx")].map(x=>"• "+x.innerText.trim());
          const txt=`Hi team! Quick questions on ${cardTitle.replace(/<[^>]+>/g,"")}:\n`+qs.join("\n");
          (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Copied: paste it into WhatsApp"),()=>toast("Couldn't copy"))};
        card.append(qbox);sec.append(card)};
      [...holder.childNodes].forEach(n=>{
        if(n.nodeName==="H3")newCard(n.innerHTML);
        else if(n.nodeName==="UL"&&card){n.querySelectorAll(":scope > li").forEach(li=>{
          const st=li.querySelector("strong");const lab=st?st.textContent.replace(/:$/,"").trim():"";if(st)st.remove();
          const body=li.innerHTML.trim();
          if(/^ask/i.test(lab)){const who=(lab.match(/\((.*?)\)/)||[])[1];const q=el("div","q");const cb=el("input");cb.type="checkbox";
            const key="ask:"+hash(body);cb.checked=store.get(key)==="1";q.classList.toggle("asked",cb.checked);
            cb.onchange=()=>{q.classList.toggle("asked",cb.checked);cb.checked?store.set(key,"1"):store.del(key)};
            const tx=el("div","tx",(who?`<span class="who">${who}</span>`:"")+body);q.append(cb,tx);qbox.append(q);qcount++}
          else{const k=/^not/i.test(lab)?"not":/^(still|await)/i.test(lab)?"wait":/^final/i.test(lab)?"fin":"not";
            const ul=cols[k].querySelector("ul");
            ul.append(el("li","",body))}})}
      });
      sec.querySelectorAll(".col ul").forEach(ul=>{if(!ul.children.length)ul.append(el("li","none","Nothing yet"))});
      sec.querySelectorAll(".qs").forEach(q=>{if(!q.querySelector(".q"))q.remove()});
      count=qcount;stats.ask={n:qcount,id};
    }else if(kind==="campaigns"){
      const grid=el("div","grid");let card=null;
      [...holder.childNodes].forEach(n=>{
        if(n.nodeName==="H3"){card=el("div","card camp");card.append(el("h3","",n.innerHTML));grid.append(card)}
        else if(n.nodeName==="UL"&&card){const ul=el("ul");
          n.querySelectorAll(":scope > li").forEach(li=>{const st=li.querySelector("strong");const lab=st?st.textContent.replace(/:$/,"").trim():"";
            if(/^status/i.test(lab)){st.remove();card.insertBefore(el("div","status","<b>Status:</b> "+li.innerHTML.trim()),card.children[1]||null);return}
            const cls=/^decided/i.test(lab)?"decided":/^changed/i.test(lab)?"changed":/^next/i.test(lab)?"next":"other";
            if(st&&lab.length<30){st.remove();li.innerHTML=`<span class="lbl ${cls}">${lab}</span>`+li.innerHTML.trim()}
            if(cls==="next")li.classList.add("next");ul.append(li)});
          card.append(ul)}
      });
      sec.append(grid);count=grid.querySelectorAll(".camp").length;stats.campaigns={n:count,id};
    }else{
      const card=el("div","card");const ul=el("ul","list"+(kind==="waiting"?" wait":""));
      holder.querySelectorAll(":scope > ul > li").forEach(li=>ul.append(li));
      if(ul.children.length)card.append(ul);else card.append(...holder.childNodes);
      sec.append(card);count=ul.children.length;
      if(kind==="waiting")stats.waiting={n:count,id};
    }
    cnt.textContent=cnt.textContent||count;
    root.append(sec);
    const tab=el("a","tab",name.replace(/^(\S+)\s/,"$1&nbsp;")+`<b>${kind==="tasks"?"":count}</b>`);tab.href="#"+id;tabs.append(tab);
  });
  // stat cards
  const S=document.getElementById("stats");
  const card=(cls,s,label,extra="")=>{const a=el("a","stat "+cls,`<div class="n">${s?s.n:0}</div><div class="l">${label}</div>${extra}`);if(s)a.href="#"+s.id;S.append(a)};
  card("t",stats.tasks,"Tasks open",'<div class="bar"><i></i></div>');
  card("w",stats.waiting,"Waiting on your reply");
  card("a",stats.ask,"Questions to ask the team");
  card("m",stats.mentions,"Mentions to answer");
  if(window.refreshTasks)refreshTasks();
  // search
  document.getElementById("q").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();
    document.querySelectorAll("#sections li, #sections .camp").forEach(x=>{if(x.closest(".camp")&&x.tagName==="LI")return;
      x.classList.toggle("gone",!!q&&!x.textContent.toLowerCase().includes(q))});
    document.querySelectorAll("#sections details").forEach(d=>{if(q)d.open=true});
  });
  document.getElementById("lockwrap").style.display="none";document.getElementById("app").style.display="block";
}
function toast(m){let t=document.querySelector(".toast");if(!t){t=el("div","toast");document.body.append(t)}t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1800)}
const PWKEY="wa-digest-pw",SEENKEY="wa-digest-seen",IDLE=24*60*60*1000;
const touch=()=>{if(store.get(PWKEY))store.set(SEENKEY,String(Date.now()))};
function forget(){store.del(PWKEY);store.del(SEENKEY)}
async function unlock(pw,remember){const P=JSON.parse(await decrypt(pw));build(P);if(remember){store.set(PWKEY,pw);touch()}}
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const err=document.getElementById("err");err.textContent="Unlocking…";
  if(!window.crypto||!crypto.subtle){err.textContent="This browser view can't unlock pages. Open the link in Safari or Chrome.";return}
  const pw=document.getElementById("pw").value;let P;try{P=JSON.parse(await decrypt(pw))}catch(x){err.textContent="Wrong password.";return}
  try{build(P);err.textContent="";if(document.getElementById("rem").checked){store.set(PWKEY,pw);touch()}else forget()}catch(x){err.textContent="Something went wrong showing the page.";console.error(x)}};
document.getElementById("lockbtn").onclick=()=>{forget();location.reload()};
// Stay unlocked while you keep using it; lock after 1 day without opening the page.
["click","keydown","scroll","visibilitychange"].forEach(ev=>addEventListener(ev,()=>{if(!document.hidden)touch()},{passive:true}));
(async()=>{const pw=store.get(PWKEY);if(!pw)return;
  const seen=+store.get(SEENKEY)||0;if(Date.now()-seen>IDLE){forget();return}
  try{await unlock(pw,true)}catch(_){forget()}})();
</script></body></html>
