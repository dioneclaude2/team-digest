<title>Team digest</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#5f6b7a;--line:#e3e6ea;--accent:#1f9d55;--accent-ink:#fff;--err:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#0f1214;--card:#171b1f;--text:#e8ebee;--muted:#9aa5b1;--line:#2a3036;--accent:#2fbf6b;--accent-ink:#06210f;--err:#ff6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 64px}
.lock{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px}
.lock h1{font-size:20px;margin:0 0 6px}.lock p{color:var(--muted);margin:0 0 18px;font-size:14px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:16px}
button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;cursor:pointer}
label.rem{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;color:var(--muted)}label.rem input{width:auto}
.err{color:var(--err);font-size:14px;min-height:20px;margin-top:8px}
#content{display:none}
#content h1{font-size:22px;line-height:1.3}
#content h2{font-size:19px;margin-top:32px;padding-bottom:6px;border-bottom:1px solid var(--line)}
#content h3{font-size:16px;margin-top:22px}
#content li{margin:6px 0}#content a{color:var(--accent)}
.meta{color:var(--muted);font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.bar a{font-size:14px;color:var(--muted)}
</style></head><body>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const b=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},b,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c)));
}
function show(html){document.getElementById("body").innerHTML=html;document.getElementById("lock").style.display="none";document.getElementById("content").style.display="block";}
const KEY="wa-digest-pw";
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const pw=document.getElementById("pw").value,err=document.getElementById("err");err.textContent="Unlocking…";
  try{show(await open(pw));err.textContent="";if(document.getElementById("rem").checked){try{localStorage.setItem(KEY,pw)}catch(_){}}}
  catch(_){err.textContent="Wrong password.";}};
document.getElementById("lockbtn").onclick=e=>{e.preventDefault();try{localStorage.removeItem(KEY)}catch(_){};location.reload();};
(async()=>{let pw=null;try{pw=localStorage.getItem(KEY)}catch(_){}if(pw){try{show(await open(pw))}catch(_){try{localStorage.removeItem(KEY)}catch(_){}}}})();
